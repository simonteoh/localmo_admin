steps:
  # 1. Build using the specific app name
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'asia.gcr.io/$PROJECT_ID/localmo-admin', '.']

  # 2. Push the named image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'asia.gcr.io/$PROJECT_ID/localmo-admin']

  # 3. Deploy to Cloud Run (Singapore)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'localmo-admin' 
      - '--image'
      - 'asia.gcr.io/$PROJECT_ID/localmo-admin'
      - '--region'
      - 'asia-southeast1'
      - '--allow-unauthenticated'

options:
  logging: CLOUD_LOGGING_ONLY